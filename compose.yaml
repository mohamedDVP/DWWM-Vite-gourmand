
services:
###> doctrine/doctrine-bundle ###
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - path: .env.docker
        required: false
      - path: .env.docker.local
        required: true
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:80"

  mysql:
    image: mysql:8.4
    env_file:
      - path: .env.docker
        required: false
      - path: .env.docker.local
        required: true
    ports:
      - "53228:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mysql_data:/var/lib/mysql:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
  
  phpmyadmin:
    image: phpmyadmin:5.2.3
    environment:
      PMA_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:80"
  
  mongodb:
    image: mongo:8
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
      - path: .env.docker.local
        required: true
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
###> doctrine/doctrine-bundle ###
  mysql_data:
###> doctrine/mongodb-odm-bundle ###
  mongodb_data:
